name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install Calcit and Caps
        env:
          CALCIT_VERSION: 0.14.7
          CALCIT_SHA256: 85dcf721993058c628b948f21f12e4d12c4feb6ffc4eed5bdd520c4662ac65d8
          CAPS_VERSION: 0.1.1
          CAPS_SHA256: 3eb13b12cae24018e9aa079d43f3245030e85db0823c64c5ba39fd8217b7b5f9
        run: |
          tool_dir="$RUNNER_TEMP/calcit-bin"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error \
            "https://github.com/calcit-lang/calcit/releases/download/$CALCIT_VERSION/calcit" \
            --output "$tool_dir/calcit"
          curl --fail --location --silent --show-error \
            "https://github.com/calcit-lang/caps/releases/download/$CAPS_VERSION/caps" \
            --output "$tool_dir/caps"
          echo "$CALCIT_SHA256  $tool_dir/calcit" | sha256sum --check
          echo "$CAPS_SHA256  $tool_dir/caps" | sha256sum --check
          chmod +x "$tool_dir/calcit" "$tool_dir/caps"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: "compiles to js"
        run: |
          caps --ci
          yarn install --immutable
          yarn check
          yarn test:storage
          yarn test:canvas
          yarn vite build --base=./

      - name: Deploy to server
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ steps.deploy.outputs.status }}"
